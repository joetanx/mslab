location: ${LOCATION}
resourceGroup: ${RG}
name: ${APP_NAME}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ${UAMI_RSC_ID}: {}
properties:
  managedEnvironmentId: ${CAE_ID}
  configuration:
    registries:
      - server: ${ACR_NAME}.azurecr.io
        identity: ${UAMI_RSC_ID}
    ingress:
      external: true
      allowInsecure: false
      targetPort: 3978
      transport: auto
      additionalPortMappings:
        - external: true
          targetPort: 8888
          exposedPort: 8888
    secrets:
      - name: jupyter-password-hash
        value: "${JUPYTER_PASSWORD_HASH}"
  template:
    volumes:
      - name: ${APP_NAME}-vol
        storageType: AzureFile
        storageName: ${APP_NAME}
    containers:
      - name: ${APP_NAME}
        image: ${ACR_NAME}.azurecr.io/${APP_NAME}:latest
        volumeMounts:
          - volumeName: ${APP_NAME}-vol
            mountPath: /home/jovyan/work
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          # Jupyter Notebook configuration
          - name: JUPYTER_PASSWORD_HASH
            secretRef: jupyter-password-hash
          - name: JUPYTER_ALLOW_INSECURE_WRITES
            value: "1"
          # Listener for aiohttp.web run_app
          - name: HOST
            value: "0.0.0.0"
          - name: PORT
            value: "3978"
          # LangChain model connection
          - name: FOUNDRY_PROJECT_ENDPOINT
            value: "${FOUNDRY_PROJECT_ENDPOINT}"
          - name: FOUNDRY_MODEL
            value: "${FOUNDRY_MODEL}"
          - name: UAMI_CLIENT_ID
            value: "${UAMI_CLIENT_ID}"
          # Use agentic authentication for MCP (optional, defaults to true)
          # - name: USE_AGENTIC_AUTH
          #   value: "true"
          # Set to production for a365 tooling to discovery mcp tools
          # If unset or "development", a365 tooling attempts to read from ToolingManifest.json
          - name: PYTHON_ENVIRONMENT
            value: "production"
          # Required for observability SDK
          - name: ENABLE_OBSERVABILITY
            value: "true"
          - name: ENABLE_A365_OBSERVABILITY_EXPORTER
            value: "true"
          # Service connection settings (stamped by `a365 setup all` against the Entra app)
          - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__AUTHORITY
            value: "https://login.microsoftonline.com/${TENANT_ID}"
          - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__AUTHTYPE
            value: FederatedCredentials
          - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTID
            value: "${BLUEPRINT_CLIENT_ID}"
          - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__FEDERATEDCLIENTID
            value: "${UAMI_CLIENT_ID}"
          - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__TENANTID
            value: "${TENANT_ID}"
          # Agent identity and user IDs
          - name: AGENTIC_INSTANCE_ID
            value: "${AGENTIC_INSTANCE_ID}"
          - name: AGENTIC_USER_ID
            value: "${AGENTIC_USER_ID}"
        probes:
          - type: Startup
            tcpSocket:
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          - type: Liveness
            tcpSocket:
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          - type: Readiness
            tcpSocket:
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
    scale:
      minReplicas: 1
      maxReplicas: 1